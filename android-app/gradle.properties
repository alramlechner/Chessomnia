org.gradle.jvmargs=-Xmx3072m -XX:+UseG1GC -Dfile.encoding=UTF-8
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true

# Build speed. On a slow machine each of these is worth several seconds per run:
# without the daemon the JVM start alone costs ~8 s, and the configuration phase
# another ~10 s.
org.gradle.caching=true
org.gradle.configuration-cache=true
org.gradle.parallel=true
