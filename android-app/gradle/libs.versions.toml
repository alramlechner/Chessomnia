# Google Play requires targetSdk 36 for new apps and updates. AGP below 8.9
# cannot compile against API 36, which pulls Gradle and Kotlin along with it.
# Java 17 stays mandatory: AGP 8.13 requires JDK 17.
[versions]
agp = "8.13.2"
kotlin = "2.2.21"
coreKtx = "1.17.0"
composeBom = "2026.06.01"
activityCompose = "1.11.0"
navigationCompose = "2.9.8"
lifecycleViewmodelCompose = "2.9.4"
kotlinxSerialization = "1.11.0"
junit = "4.13.2"
playPublisher = "3.9.1"

# WARNING: the ceiling is AGP 8.13.2 with compileSdk 36. Newer AndroidX releases
# (core-ktx >= 1.18, compose-ui >= 1.12, activity >= 1.12) already require
# compileSdk 37 and AGP >= 9.1 and will break the build. Raise the toolchain
# first -- do not bump individual libraries.

[libraries]
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
compose-ui = { group = "androidx.compose.ui", name = "ui" }
compose-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
compose-material3 = { group = "androidx.compose.material3", name = "material3" }
activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
navigation-compose = { group = "androidx.navigation", name = "navigation-compose", version.ref = "navigationCompose" }
lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycleViewmodelCompose" }
kotlinx-serialization-json = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-json", version.ref = "kotlinxSerialization" }
junit = { group = "junit", name = "junit", version.ref = "junit" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
play-publisher = { id = "com.github.triplet.play", version.ref = "playPublisher" }
